name: Deploy to EKS

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: "Deployment environment"
        required: true
        default: dev
        type: choice
        options:
          - dev
          - staging
          - prod
      image_tag:
        description: "Override image tag (default: commit SHA)"
        required: false

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  EKS_CLUSTER_NAME: ${{ vars.EKS_CLUSTER_NAME || 'booking-app-eks-dev' }}
  DEPLOY_ENV: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'dev' }}
  IMAGE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.image_tag || github.sha }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: frontend
            context: frontend
            dockerfile: frontend/Dockerfile
            repo: booking-frontend
          - name: backend
            context: backend
            dockerfile: backend/Dockerfile
            repo: booking-backend
          - name: agent
            context: agent
            dockerfile: agent/Dockerfile
            repo: booking-agent
          - name: agent-langgraph
            context: agent_langgraph
            dockerfile: agent_langgraph/Dockerfile
            repo: booking-agent-langgraph
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Ensure ECR Repository
        shell: bash
        run: |
          set -euo pipefail
          aws ecr describe-repositories --repository-names "${{ matrix.repo }}" >/dev/null 2>&1 || \
            aws ecr create-repository --repository-name "${{ matrix.repo }}" >/dev/null

      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.login-ecr.outputs.registry }}/${{ matrix.repo }}:${{ env.IMAGE_TAG }}

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: ${{ env.DEPLOY_ENV }}
    concurrency: deploy-${{ env.DEPLOY_ENV }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.29.0

      - name: Install kustomize
        shell: bash
        run: |
          set -euo pipefail
          curl -sSL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.4.2/kustomize_v5.4.2_linux_amd64.tar.gz" | tar -xz
          sudo mv kustomize /usr/local/bin/kustomize

      - name: Configure kubeconfig
        run: aws eks update-kubeconfig --name "${{ env.EKS_CLUSTER_NAME }}" --region "${{ env.AWS_REGION }}"

      - name: Update Images
        shell: bash
        run: |
          set -euo pipefail
          REGISTRY=$(aws sts get-caller-identity --query Account --output text).dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com
          OVERLAY="platform/kubernetes/overlays/${{ env.DEPLOY_ENV }}"
          cd "$OVERLAY"
          kustomize edit set image ghcr.io/replace-me/booking-frontend=${REGISTRY}/booking-frontend:${{ env.IMAGE_TAG }}
          kustomize edit set image ghcr.io/replace-me/booking-backend=${REGISTRY}/booking-backend:${{ env.IMAGE_TAG }}
          kustomize edit set image ghcr.io/replace-me/booking-agent=${REGISTRY}/booking-agent:${{ env.IMAGE_TAG }}
          kustomize edit set image ghcr.io/replace-me/booking-agent-langgraph=${REGISTRY}/booking-agent-langgraph:${{ env.IMAGE_TAG }}

      - name: Deploy
        run: kubectl apply -k platform/kubernetes/overlays/${{ env.DEPLOY_ENV }}

      - name: Rollout Status
        run: |
          kubectl -n booking-app rollout status deployment/frontend --timeout=5m
          kubectl -n booking-app rollout status deployment/backend --timeout=5m
          kubectl -n booking-app rollout status deployment/agent --timeout=5m
          kubectl -n booking-app rollout status deployment/agent-langgraph --timeout=5m
