services:
  frontend:
    build:
      context: ./frontend
    container_name: booking-frontend
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_BASE_URL: http://localhost:5000/api
      NEXT_PUBLIC_AGENT_API_BASE_URL: http://localhost:8001/api
      NEXT_PUBLIC_AGENT_WS_URL: ws://localhost:8001/api/chat/ws
    ports:
      - "3000:3000"
    depends_on:
      - backend
      - agent-langgraph
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    container_name: booking-backend
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: mongodb://mongo:27017/hotel_booking
      JWT_SECRET: change-me-jwt-secret
      TEMP_ADMIN_KEY: change-me-admin-key
      FRONTEND_ORIGIN: http://localhost:3000
    ports:
      - "5000:5000"
    depends_on:
      - mongo
    restart: unless-stopped

  agent:
    build:
      context: ./agent
    container_name: booking-agent-v1
    environment:
      FASTAPI_ENV: production
      FASTAPI_HOST: 0.0.0.0
      FASTAPI_PORT: 8000
      LOG_LEVEL: INFO
      FRONTEND_ORIGIN: http://localhost:3000
      EXPRESS_BACKEND_URL: http://backend:5000
      MONGO_URI: mongodb://mongo:27017
      MONGO_DB_NAME: hotel_booking
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION_NAME: hotel_knowledge
      JWT_SECRET_KEY: change-me-jwt-secret
      GROQ_API_KEY: ${GROQ_API_KEY:-}
    ports:
      - "8000:8000"
    depends_on:
      - backend
      - qdrant
      - mongo
    restart: unless-stopped

  agent-langgraph:
    build:
      context: ./agent_langgraph
    container_name: booking-agent-langgraph
    environment:
      FASTAPI_ENV: production
      FASTAPI_HOST: 0.0.0.0
      FASTAPI_PORT: 8001
      LOG_LEVEL: INFO
      FRONTEND_ORIGIN: http://localhost:3000
      EXPRESS_BACKEND_URL: http://backend:5000
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION_NAME: hotel_knowledge
      JWT_SECRET_KEY: change-me-jwt-secret
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      MONGODB_URI: mongodb://mongo:27017/hotel_booking
    ports:
      - "8001:8001"
    depends_on:
      - backend
      - qdrant
      - mongo
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.9.5
    container_name: booking-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  mongo:
    image: mongo:7
    container_name: booking-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

volumes:
  qdrant_data:
  mongo_data:
