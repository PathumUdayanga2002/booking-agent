  NEXT_PUBLIC_AGENT_API_BASE_URL: "https://agent.booking.local/api"
  NEXT_PUBLIC_AGENT_WS_URL: "wss://agent.booking.local/api/chat/ws"
  QDRANT_URL: "http://qdrant:6333"
  QDRANT_COLLECTION_NAME: "hotel_knowledge"
