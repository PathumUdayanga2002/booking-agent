apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: booking-app
  labels:
    app.kubernetes.io/name: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend
    spec:
      containers:
        - name: backend
          image: ghcr.io/replace-me/booking-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
              name: http
          env:
            - name: PORT
              value: "5000"
            - name: FRONTEND_ORIGIN
              valueFrom:
                configMapKeyRef:
                  name: booking-app-config
                  key: FRONTEND_ORIGIN
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: booking-app-config
                  key: NODE_ENV
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: booking-app-secrets
                  key: JWT_SECRET
            - name: MONGODB_URI
              valueFrom:
                secretKeyRef:
                  name: booking-app-secrets
                  key: MONGODB_URI
            - name: TEMP_ADMIN_KEY
              valueFrom:
                secretKeyRef:
                  name: booking-app-secrets
                  key: TEMP_ADMIN_KEY
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
