apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: booking-app-ingress
  namespace: booking-app
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "20m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: nginx
  rules:
    - host: app.booking.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 3000
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 5000
    - host: agent.booking.local
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: agent-langgraph
                port:
                  number: 8001
    - host: agent-v1.booking.local
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: agent
                port:
                  number: 8000
